        WORKDIR /src
        COPY ["Directory.Build.props", "Directory.Packages.props", "./"]
        COPY ["src/Contracts/Contracts.csproj", "src/Contracts/"]
        COPY ["src/ServiceDefaults/ServiceDefaults.csproj", "src/ServiceDefaults/"]
        COPY ["src/Client.Jumbee/Client.Jumbee.csproj", "src/Client.Jumbee/"]
        RUN dotnet restore "src/Client.Jumbee/Client.Jumbee.csproj"
        COPY src/Contracts/ src/Contracts/
        COPY src/ServiceDefaults/ src/ServiceDefaults/
        COPY src/Client.Jumbee/ src/Client.Jumbee/
        RUN dotnet publish "src/Client.Jumbee/Client.Jumbee.csproj" -c Release -o /app/publish

        FROM mcr.microsoft.com/dotnet/aspnet:11.0 AS final
        WORKDIR /app
