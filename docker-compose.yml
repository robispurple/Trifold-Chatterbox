        COPY ["Directory.Build.props", "Directory.Packages.props", "./"]
        COPY ["src/Contracts/Contracts.csproj", "src/Contracts/"]
        COPY ["src/ServiceDefaults/ServiceDefaults.csproj", "src/ServiceDefaults/"]
        COPY ["src/Client.TerminalGui/Client.TerminalGui.csproj", "src/Client.TerminalGui/"]
        RUN dotnet restore "src/Client.TerminalGui/Client.TerminalGui.csproj"
        COPY src/Contracts/ src/Contracts/
        COPY src/ServiceDefaults/ src/ServiceDefaults/
        COPY src/Client.TerminalGui/ src/Client.TerminalGui/
        RUN dotnet publish "src/Client.TerminalGui/Client.TerminalGui.csproj" -c Release -o /app/publish

        FROM mcr.microsoft.com/dotnet/aspnet:11.0 AS final
        WORKDIR /app
        COPY --from=build /app/publish .
        ENTRYPOINT ["dotnet", "Client.TerminalGui.dll"]
    container_name: chatterbox-client-terminalgui
    stdin_open: true
    tty: true
    environment:
      - DOTNET_ENVIRONMENT=Development
      - HubServerUrl=http://hubserver:8080
      - GrpcServerUrl=http://hubserver:5001
      - OTEL_SERVICE_NAME=Client.TerminalGui
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
